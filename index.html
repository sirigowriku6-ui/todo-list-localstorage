<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My To-Do List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">
  <h1>✅ My To-Do List</h1>
  <p class="subtitle">Add tasks, tick them done, refresh - they stay saved!</p>

  <form id="task-form">
    <input id="task-input" type="text" placeholder="What do you need to do?" autocomplete="off">
    <button type="submit">Add Task</button>
  </form>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
    <button id="clear-completed">Clear Completed</button>
  </div>

  <p id="task-count">0 tasks left</p>

  <ul id="task-list"></ul>

  <p id="empty-msg">No tasks yet. Add your first task above!</p>
</main>

<script src="app.js"></script>
</body>
</html>
